# Minimal OpenWA host — used by bootstrap-openwa.sh
# Image matches the manual micro-VPS proof (ghcr.io/rmyndharis/openwa:latest).
services:
  openwa:
    image: ghcr.io/rmyndharis/openwa:latest
    container_name: openwa-api
    restart: unless-stopped
    ports:
      - "2785:2785"
    environment:
      NODE_ENV: production
      BIND_HOST: "0.0.0.0"
      API_PORT: "2785"
      PORT: "2785"
      ENGINE_TYPE: baileys
      AUTO_START_SESSIONS: "true"
      DATABASE_TYPE: sqlite
      DATABASE_NAME: ./data/openwa.sqlite
      DATABASE_SYNCHRONIZE: "true"
      DATABASE_LOGGING: "false"
      SESSION_DATA_PATH: ./data/sessions
      PUPPETEER_HEADLESS: "true"
      PUPPETEER_ARGS: "--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu"
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: ./data/media
      REDIS_ENABLED: "false"
      QUEUE_ENABLED: "false"
      CACHE_ENABLED: "false"
      CSP_UPGRADE_INSECURE_REQUESTS: "false"
      OPENWA_MEM_LIMIT: 1200m
    volumes:
      - ./data:/app/data
    stop_grace_period: 75s
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      # Full path — image healthcheck PATH often omits /usr/bin
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:2785/api/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
